name: Linux packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.2.0)
        required: true
        default: 0.2.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential libgl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 wget
          sudo gem install --no-document fpm
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-linux.txt pyinstaller
      - name: Build portable application
        run: pyinstaller --clean --noconfirm capricorn.spec
      - name: Install AppImage tooling
        run: |
          wget -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool
      - name: Package DEB, RPM and AppImage
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: bash packaging/build-linux-packages.sh "${VERSION#v}"
      - name: Upload release packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/packages/*.deb
            build/packages/*.rpm
            build/packages/*.AppImage
      - name: Upload workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: capricorn-linux-packages
          path: build/packages/*
